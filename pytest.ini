[pytest]
# Qamrov aniq belgilangan: `pytest` ni ildizdan chaqirsa ham faqat
# tests/ yig'iladi.
#
# Busiz `scripts/qabul_test.py` ham yig'ilardi — nomi `*_test.py`
# shabloniga tushadi, ichi esa jonli serverga ulanadigan qabul
# tekshiruvi va u IMPORT paytida ishlaydi. Server ishlamayotgan
# bo'lsa butun to'plam collection error bilan to'xtardi. CI `pytest
# tests` deb yozgani uchun bu faqat lokal ishda ko'rinardi.
testpaths = tests
