# Nigoh — negoh.das-uty.uz (89.236.217.32) uchun nginx konfiguratsiyasi.
# Servis 127.0.0.1:23005 da (.env: PORT=23005), MediaMTX standart portlarda.
#
# O'rnatish (serverda):
#   sudo cp deploy/negoh.das-uty.uz.conf /etc/nginx/sites-available/negoh.conf
#   sudo ln -s /etc/nginx/sites-available/negoh.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# HTTPS (tavsiya, DNS ishlagach):
#   sudo certbot --nginx -d negoh.das-uty.uz
#   keyin .env da: MEDIA_BASE=https://negoh.das-uty.uz/media
#
# Diqqat: WebRTC UDP 8189 nginx'dan o'tmaydi — firewall'da to'g'ridan oching.

server {
    listen 80;
    server_name negoh.das-uty.uz;

    # SSE (jonli hodisalar va skan natijalari) — buferlash O'CHIQ bo'lishi
    # SHART: aks holda hodisalar nginx buferida turib qoladi va "jonli"
    # oqim daqiqalab kechikadi. Ulanish uzoq ochiq turadi.
    location ~ ^/api(/v1)?/events$ {
        proxy_pass http://127.0.0.1:23005;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
    }
    location ~ ^/api(/v1)?/devices/scan/[^/]+/events$ {
        proxy_pass http://127.0.0.1:23005;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # HLS video — bitta domen ostidan (.env: MEDIA_BASE=http://negoh.das-uty.uz/media,
    # HTTPS'dan keyin https://... ga almashtiring)
    location /media/hls/ {
        proxy_pass http://127.0.0.1:8888/;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;
        # MediaMTX redirect'lari (cookieCheck va h.k.) prefikssiz yoki
        # http:// bilan kelishi mumkin — doim to'liq https manzilga
        # keltiramiz, aks holda brauzer Mixed Content deb bloklaydi
        # (443 ni alohida oldingi proxy xizmat qilganda ham ishlaydi).
        proxy_redirect ~^(?:https?://[^/]+)?/(?:media/hls/)?(.*)$ https://negoh.das-uty.uz/media/hls/$1;
        # MediaMTX auth-cookie'sining Path'i prefikssiz keladi — qayta
        # yozilmasa brauzer cookie'ni qaytarmaydi va cookieCheck cheksiz
        # aylanadi (playlist so'ralaveradi, segmentlar boshlanmaydi).
        proxy_cookie_path ~*^/(.*)$ /media/hls/$1;
    }

    # WebRTC signal (WHEP)
    location /media/whep/ {
        proxy_pass http://127.0.0.1:8889/;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_redirect ~^(?:https?://[^/]+)?/(?:media/whep/)?(.*)$ https://negoh.das-uty.uz/media/whep/$1;
    }

    # API + konsol (qolgan hamma narsa)
    location / {
        proxy_pass http://127.0.0.1:23005;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
