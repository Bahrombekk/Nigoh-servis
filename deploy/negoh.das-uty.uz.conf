# Nigoh — negoh.das-uty.uz (89.236.217.32) uchun nginx konfiguratsiyasi.
# Servis 127.0.0.1:23005 da (.env: PORT=23005), MediaMTX standart portlarda.
#
# O'rnatish (serverda):
#   sudo cp deploy/negoh.das-uty.uz.conf /etc/nginx/sites-available/negoh.conf
#   sudo ln -s /etc/nginx/sites-available/negoh.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# HTTPS (tavsiya, DNS ishlagach):
#   sudo certbot --nginx -d negoh.das-uty.uz
#   keyin .env da: MEDIA_BASE=https://negoh.das-uty.uz/media
#
# Diqqat: WebRTC UDP 8189 nginx'dan o'tmaydi — firewall'da to'g'ridan oching.

server {
    listen 80;
    server_name negoh.das-uty.uz;

    # SSE (jonli hodisalar va skan natijalari) — buferlash O'CHIQ bo'lishi
    # SHART: aks holda hodisalar nginx buferida turib qoladi va "jonli"
    # oqim daqiqalab kechikadi. Ulanish uzoq ochiq turadi.
    location ~ ^/api(/v1)?/events$ {
        proxy_pass http://127.0.0.1:23005;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
    }
    location ~ ^/api(/v1)?/devices/scan/[^/]+/events$ {
        proxy_pass http://127.0.0.1:23005;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # HLS video — bitta domen ostidan (.env: MEDIA_BASE=http://negoh.das-uty.uz/media,
    # HTTPS'dan keyin https://... ga almashtiring)
    location /media/hls/ {
        # Tomoshabin chiptasi SHU YERDA tekshiriladi (quyidagi /_hlsauth).
        # Nima uchun: pastdagi Bearer sarlavhasi bilan kelgan so'rovni
        # MediaMTX shartsiz o'tkazadi va bizning auth ilgagimizni umuman
        # chaqirmaydi. Tekshiruv nginx'ga ko'chmasa, slug'ni bilgan har
        # kim kamerani ko'ra olardi.
        auth_request /_hlsauth;

        # "CDN kaliti" — MediaMTX bu sarlavhani ko'rsa SESSIYASIZ ishlaydi
        # va manzillarga na `session=`, na `token=` qo'shadi.
        #
        # Nima uchun kerak: sessiyali rejimda manba qisqa uzilsa (bizda
        # shlyuz har 60 soniyada RTSP'ni soxta RST bilan uzadi) MediaMTX
        # HLS muxerini yo'q qiladi, muxer bilan sessiya ham o'ladi va
        # mijoz DOIMIY 401 oladi — o'lchovda o'sha manzil 96 marta
        # ketma-ket 401 berdi va o'z-o'zidan tiklanmadi. Sessiyasiz
        # rejimda bekor bo'ladigan holat yo'q: manba qaytishi bilan
        # o'sha manzil ishlashda davom etadi.
        #
        # QIYMAT .env dagi HLS_CDN_SECRET bilan AYNAN bir xil bo'lishi
        # shart — ikkisi mos kelmasa hamma HLS so'rovi 401 bo'ladi.
        proxy_set_header Authorization "Bearer BU_YERGA_HLS_CDN_SECRET";

        proxy_pass http://127.0.0.1:8888/;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;
        # MediaMTX redirect'lari (cookieCheck va h.k.) prefikssiz yoki
        # http:// bilan kelishi mumkin — doim to'liq https manzilga
        # keltiramiz, aks holda brauzer Mixed Content deb bloklaydi
        # (443 ni alohida oldingi proxy xizmat qilganda ham ishlaydi).
        proxy_redirect ~^(?:https?://[^/]+)?/(?:media/hls/)?(.*)$ https://negoh.das-uty.uz/media/hls/$1;
    }

    # Chipta tekshiruvi — faqat ichki, tashqaridan chaqirilmaydi.
    # Nginx har bir /media/hls/ so'rovi uchun bu yerga kiradi; javob
    # 204 bo'lsa so'rov MediaMTX'ga o'tadi, 401 bo'lsa rad etiladi.
    location = /_hlsauth {
        internal;
        proxy_pass http://127.0.0.1:23005/api/auth/hls;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        # Asl manzil va tomoshabin IP'si — chipta shu ikkisiga tekshiriladi.
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Viewer-IP $remote_addr;
    }

    # WebRTC signal (WHEP)
    location /media/whep/ {
        proxy_pass http://127.0.0.1:8889/;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_redirect ~^(?:https?://[^/]+)?/(?:media/whep/)?(.*)$ https://negoh.das-uty.uz/media/whep/$1;
    }

    # API + konsol (qolgan hamma narsa)
    location / {
        proxy_pass http://127.0.0.1:23005;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
